# Compila Nítido en GitHub y publica el APK en "Releases".
# Todos los pasos están en ci/build-apk.sh.
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read
  checks: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/build-apk.sh
      - if: failure()
        run: bash ci/on-failure.sh
